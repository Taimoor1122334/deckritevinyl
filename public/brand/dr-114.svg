<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 321" width="248" height="321" style="background:#ffffff">
  <!-- Outer CAD border -->
  <rect x="4" y="4" width="240" height="313" fill="#ffffff" stroke="#0f2042" stroke-width="1.5" />
  <rect x="7" y="7" width="234" height="307" fill="#ffffff" stroke="#94a3b8" stroke-width="0.5" />

  <!-- Technical Grid Pattern -->
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="8" y="8" width="232" height="235" fill="url(#grid)" />

  <!-- Diagram graphics -->
  
      <!-- Substrate & Wall -->
      <line x1="40" y1="200" x2="220" y2="200" stroke="#0f172a" stroke-width="3" />
      <line x1="80" y1="200" x2="80" y2="60" stroke="#0f172a" stroke-width="3" />
      <polygon points="75,60 85,60 85,200 75,200" fill="#cbd5e1" />
      <polygon points="80,195 220,195 220,205 80,205" fill="#cbd5e1" />

      <!-- Membrane Layer (Red) -->
      <polyline points="215,193 84,193 84,80" fill="none" stroke="#dc2626" stroke-width="2.5" />

      <!-- Inside Corner Fold / Overlap -->
      <polyline points="84,140 100,140 100,193" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="2 2" />

      <!-- Term Bar -->
      <rect x="74" y="80" width="16" height="12" fill="#0f2042" rx="1" />
      <circle cx="82" cy="86" r="2" fill="#ffffff" />
      <path d="M 74 80 Q 82 74 90 80" stroke="#0f2042" stroke-width="2" fill="#0f2042" />

      <!-- Callout lines -->
      <line x1="90" y1="86" x2="160" y2="86" stroke="#475569" stroke-width="0.75" />
      <text x="163" y="88" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#0f2042">TERM BAR &amp; CAULK</text>

      <line x1="84" y1="120" x2="150" y2="120" stroke="#dc2626" stroke-width="0.75" />
      <text x="153" y="122" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#dc2626">4" MIN TURN-UP</text>

      <line x1="120" y1="193" x2="120" y2="170" stroke="#0f172a" stroke-width="0.75" />
      <polyline points="118,175 120,170 122,175" stroke="#0f172a" stroke-width="0.75" fill="none" />
      <text x="125" y="172" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#0f172a">WELDED SEAM</text>
    

  <!-- Title Block Divider -->
  <line x1="7" y1="243" x2="241" y2="243" stroke="#0f2042" stroke-width="1.2" />

  <!-- Title Block Content -->
  <rect x="8" y="244" width="232" height="70" fill="#f8fafc" />
  <line x1="8" y1="272" x2="240" y2="272" stroke="#cbd5e1" stroke-width="0.8" />
  <line x1="165" y1="244" x2="165" y2="314" stroke="#cbd5e1" stroke-width="0.8" />

  <!-- Brand text -->
  <text x="14" y="258" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0f2042">DECKRITE L.L.C.</text>
  <text x="14" y="267" font-family="Arial, sans-serif" font-size="6.5" fill="#64748b">WATERPROOF VINYL SYSTEM</text>

  <!-- Sheet Code -->
  <rect x="170" y="248" width="65" height="20" fill="#0f2042" rx="2" />
  <text x="202" y="262" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">DR-114</text>

  <!-- Title -->
  <text x="14" y="286" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#1e293b">Inside / Outside Corner De...</text>
  <text x="14" y="297" font-family="Arial, sans-serif" font-size="6.5" fill="#64748b">CAD Detail Specification</text>
  <text x="14" y="307" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#dc2626">CLICK TO OPEN OFFICIAL PDF</text>

  <text x="170" y="290" font-family="Arial, sans-serif" font-size="6" fill="#64748b">SCALE: N.T.S.</text>
  <text x="170" y="302" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#0f2042">PDF SPEC</text>
</svg>