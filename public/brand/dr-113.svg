<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 321" width="248" height="321" style="background:#ffffff">
  <!-- Outer CAD border -->
  <rect x="4" y="4" width="240" height="313" fill="#ffffff" stroke="#0f2042" stroke-width="1.5" />
  <rect x="7" y="7" width="234" height="307" fill="#ffffff" stroke="#94a3b8" stroke-width="0.5" />

  <!-- Technical Grid Pattern -->
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="8" y="8" width="232" height="235" fill="url(#grid)" />

  <!-- Diagram graphics -->
  
      <!-- Plywood Substrate with Routed Rebate -->
      <polygon points="30,185 180,185 180,190 215,190 215,225 30,225" fill="#f1f5f9" stroke="#0f172a" stroke-width="2" />
      <!-- Slope Indicator -->
      <line x1="50" y1="170" x2="170" y2="178" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 2" />
      <polyline points="165,175 170,178 166,181" stroke="#0284c7" stroke-width="1.5" fill="none" />
      <text x="75" y="165" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#0284c7">1/16" : 1 FT SLOPE</text>

      <!-- Recessed Metal Drip Edge -->
      <path d="M 120 185 L 217 185 L 217 225 L 222 225" fill="none" stroke="#0f2042" stroke-width="2.5" />
      <!-- Roofing Nail -->
      <line x1="150" y1="175" x2="150" y2="195" stroke="#0f172a" stroke-width="2" />
      <line x1="146" y1="175" x2="154" y2="175" stroke="#0f172a" stroke-width="2" />

      <!-- PVC Membrane Welded Layer -->
      <line x1="30" y1="183" x2="215" y2="183" stroke="#dc2626" stroke-width="2.5" />

      <!-- Callout lines -->
      <line x1="150" y1="175" x2="150" y2="145" stroke="#0f172a" stroke-width="0.75" />
      <text x="125" y="140" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#0f172a">ROOFING NAIL 1FT O.C.</text>
      <line x1="217" y1="183" x2="190" y2="125" stroke="#dc2626" stroke-width="0.75" />
      <text x="165" y="120" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#dc2626">HOT AIR WELD (1" MIN)</text>
    

  <!-- Title Block Divider -->
  <line x1="7" y1="243" x2="241" y2="243" stroke="#0f2042" stroke-width="1.2" />

  <!-- Title Block Content -->
  <rect x="8" y="244" width="232" height="70" fill="#f8fafc" />
  <line x1="8" y1="272" x2="240" y2="272" stroke="#cbd5e1" stroke-width="0.8" />
  <line x1="165" y1="244" x2="165" y2="314" stroke="#cbd5e1" stroke-width="0.8" />

  <!-- Brand text -->
  <text x="14" y="258" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0f2042">DECKRITE L.L.C.</text>
  <text x="14" y="267" font-family="Arial, sans-serif" font-size="6.5" fill="#64748b">WATERPROOF VINYL SYSTEM</text>

  <!-- Sheet Code -->
  <rect x="170" y="248" width="65" height="20" fill="#0f2042" rx="2" />
  <text x="202" y="262" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">DR-113</text>

  <!-- Title -->
  <text x="14" y="286" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#1e293b">Drip Edge Flashing Over Pl...</text>
  <text x="14" y="297" font-family="Arial, sans-serif" font-size="6.5" fill="#64748b">CAD Detail Specification</text>
  <text x="14" y="307" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#dc2626">CLICK TO OPEN OFFICIAL PDF</text>

  <text x="170" y="290" font-family="Arial, sans-serif" font-size="6" fill="#64748b">SCALE: N.T.S.</text>
  <text x="170" y="302" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#0f2042">PDF SPEC</text>
</svg>